name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: build + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Build scripts probe for these via pkg-config:
      #   wayland-client, wayland-cursor (wayland-sys) -> libwayland-dev
      #   xkbcommon (smithay-client-toolkit)           -> libxkbcommon-dev
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked

      - name: Test
        run: cargo test --locked
