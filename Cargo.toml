[package]
name        = "ornatus"
version     = "0.1.0"
edition     = "2024"
description = "Wayland-native solar-gradient wallpaper and theme daemon for wlroots compositors"
license     = "GPL-3.0-or-later"
repository  = "https://github.com/ppitchford/ornatus"

[dependencies]
# Wayland — wlr-layer-shell, SHM buffers, output management
smithay-client-toolkit = "0.20"
wayland-client         = "0.31"
calloop =    { version = "0.14", features = ["signals"] }
calloop-wayland-source = "0.4"
libc = "0.2"

# Image decoding — JPG only, no need for the full format zoo
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# Time and sun math — local sunrise/sunset, no network
chrono  = { version = "0.4", features = ["serde"] }
sunrise = "3"
sun = "0.3"

# HTTP + JSON — only for IP geolocation; blocking ureq keeps us off async runtimes
ureq       = { version = "2", default-features = false, features = ["tls", "json"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Config file parsing
toml = "0.8"

# Unix signals — SIGUSR1 for force refresh
signal-hook = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }

# Structured logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"

[profile.dev.package."*"]
opt-level = 3
